
services:
  web1:
    image: nginx:latest
    container_name: compose-web-1
    ports:
      - "8082:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
    restart: unless-stopped

  web2:
    image: nginx:latest
    container_name: compose-web-2
    ports:
      - "8083:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
    restart: unless-stopped

